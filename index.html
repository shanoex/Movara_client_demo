<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1013">
<title>Movara — Mobility App Prototype</title>
<meta name="description" content="Interactive concept prototype for a mobility app: ride booking, real-time tracking and account management.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--accent:#C6F135;--ink:#0E1013;--danger:#EF4135;--ok:#18A957;--blue:#2F7BF5;--gold:#FFB020;--sat:50px;--sab:26px;--font:'Manrope',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
html[data-theme=light]{color-scheme:light;--page:#E8EAE3;--bg:#F4F5F1;--surface:#FFFFFF;--surface-2:#F1F2ED;--surface-3:#E3E5DE;--text:#0E1013;--muted:#6B7078;--line:#E7E8E2;--sel-bg:#0E1013;--sel-fg:#FFFFFF;--shadow:0 8px 24px rgba(14,16,19,.10),0 1px 3px rgba(14,16,19,.06);--map-land:#EDEFE8;--map-block:#E0E3DA;--map-park:#CFE8C2;--map-tree:#B7DCA6;--map-water:#BFDBF0;--map-road:#FFFFFF;--map-label:#A0A69C;--case:#0E1013;--sos-bg:#FDE9E7}
html[data-theme=dark]{color-scheme:dark;--page:#08090A;--bg:#0D0F11;--surface:#16191D;--surface-2:#1E2126;--surface-3:#2A2E35;--text:#F2F3F5;--muted:#9AA1AB;--line:#262A30;--sel-bg:#C6F135;--sel-fg:#0E1013;--shadow:0 8px 24px rgba(0,0,0,.5);--map-land:#15181C;--map-block:#1C2025;--map-park:#16261B;--map-tree:#1F3727;--map-water:#0E2233;--map-road:#272C33;--map-label:#5E6670;--case:#000;--sos-bg:#3A1714}
html,body{height:100%}
body{font-family:var(--font);background:var(--page);color:var(--text);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
input{font:inherit;color:inherit}
svg.i{flex:none;display:block}

/* ---------- page / pitch ---------- */
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;gap:64px;padding:20px 24px;background:radial-gradient(900px 520px at 12% 8%,rgba(198,241,53,.25),transparent 60%),radial-gradient(700px 500px at 92% 92%,rgba(47,123,245,.10),transparent 60%)}
.pitch{width:360px;flex:none}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;margin-bottom:24px;letter-spacing:-.01em}
.brand em{font-style:normal;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.09em;background:var(--text);color:var(--bg);padding:4px 8px;border-radius:7px}
.pitch h1{font-size:36px;line-height:1.06;letter-spacing:-.035em;font-weight:800;margin-bottom:14px}
.pitch p{color:var(--muted);font-size:15.5px;line-height:1.55;margin-bottom:22px}
.feats{list-style:none;display:grid;gap:11px;margin-bottom:28px}
.feats li{display:flex;gap:11px;align-items:center;font-weight:600;font-size:14.5px}
.feats li span{width:30px;height:30px;border-radius:10px;background:var(--accent);color:var(--ink);display:grid;place-items:center;flex:none}
.jump-title{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin-bottom:10px}
.jump{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:24px}
.jump button{height:34px;padding:0 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:13px;transition:background .2s,color .2s}
.jump button:hover{border-color:var(--text)}
.jump button.on{background:var(--sel-bg);color:var(--sel-fg);border-color:transparent}
.pitch-foot{display:flex;gap:8px;flex-wrap:wrap}
.pitch-foot button{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:13.5px}
.pitch-foot button:hover{border-color:var(--text)}
.hint-small{margin-top:18px;font-size:12.5px;color:var(--muted);line-height:1.5}

/* ---------- phone ---------- */
.phone-wrap{width:calc(390px * var(--s,1));height:calc(844px * var(--s,1));flex:none;position:relative}
.phone{position:absolute;left:0;top:0;width:390px;height:844px;transform:scale(var(--s,1));transform-origin:0 0;border-radius:60px;background:#0A0A0B;padding:11px;box-shadow:0 0 0 2px #2B2D31,0 50px 90px -30px rgba(0,0,0,.5),0 20px 40px -20px rgba(0,0,0,.3)}
.phone-inner{position:relative;width:100%;height:100%;border-radius:49px;overflow:hidden;background:var(--bg);isolation:isolate}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:118px;height:34px;border-radius:20px;background:#000;z-index:100}
.statusbar{position:absolute;top:0;left:0;right:0;height:50px;display:flex;align-items:center;justify-content:space-between;padding:5px 28px 0 40px;font-weight:700;font-size:15px;z-index:99;pointer-events:none;color:var(--text);transition:color .3s}
.statusbar.light{color:#fff}
.sb-icons{display:flex;gap:6px;align-items:center}
.home-ind{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:130px;height:5px;border-radius:3px;background:var(--text);opacity:.85;z-index:100;pointer-events:none}
.home-ind.light{background:#fff}

@media (max-width:1000px){.stage{flex-direction:column;gap:28px;padding:32px 20px}.pitch{width:min(560px,100%)}.pitch h1{font-size:30px}}
@media (max-width:520px){
  .stage{padding:0;gap:0;display:block;background:var(--bg)}
  .pitch{display:none}
  .phone-wrap{width:100vw;height:100vh;height:100dvh}
  .phone{width:100%;height:100%;transform:none;border-radius:0;padding:0;box-shadow:none;background:var(--bg)}
  .phone-inner{border-radius:0}
  .island,.statusbar,.home-ind{display:none}
  :root{--sat:max(env(safe-area-inset-top),14px);--sab:max(env(safe-area-inset-bottom),12px)}
  input{font-size:16px!important}
}

/* ---------- app layers ---------- */
#app{position:absolute;inset:0}
#mapLayer{position:absolute;inset:0;background:var(--map-land);transition:opacity .45s}
#mapLayer.off{opacity:0;visibility:hidden;transition:opacity .25s,visibility 0s .25s}
#msvg{display:block;width:100%;height:100%}
#pan{transition:transform .9s cubic-bezier(.3,.7,.2,1)}
.mk{transition:transform .9s cubic-bezier(.3,.7,.2,1)}
.mlabel{font:700 9px var(--font);fill:var(--map-label);letter-spacing:.12em;text-transform:uppercase}
.plabel{font:700 10px var(--font);fill:#6E9A5C;letter-spacing:.06em}
html[data-theme=dark] .plabel{fill:#5C8A5F}
.rt-case{fill:none;stroke:var(--case);stroke-width:9;stroke-linecap:round;stroke-linejoin:round;transition:opacity .4s}
.rt-main{fill:none;stroke:var(--accent);stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;transition:opacity .4s}
.rt-done{fill:none;stroke:#9AA1AA;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;opacity:.55}
.rt-drv{fill:none;stroke:var(--text);stroke-width:4;stroke-linecap:round;stroke-dasharray:1 9}
#routeG.faded .rt-case,#routeG.faded .rt-main{opacity:.3}
.me-pulse{fill:var(--blue);opacity:.3;transform-box:fill-box;transform-origin:center;animation:mepulse 2.2s ease-out infinite}
@keyframes mepulse{0%{transform:scale(.45);opacity:.45}100%{transform:scale(2.2);opacity:0}}
.rad{fill:var(--accent);opacity:0;transform-box:fill-box;transform-origin:center;animation:radar 2.4s ease-out infinite}
.rad.d2{animation-delay:.8s}.rad.d3{animation-delay:1.6s}
@keyframes radar{0%{transform:scale(.1);opacity:.55}100%{transform:scale(1.6);opacity:0}}
.bub{filter:drop-shadow(0 4px 10px rgba(0,0,0,.18))}
.btxt{font:800 12px var(--font)}

#screens{position:absolute;inset:0}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
.screen.has-map{background:transparent;pointer-events:none}
.screen.has-map>*{pointer-events:auto}
.in-fwd{animation:inF .38s cubic-bezier(.2,.8,.2,1)}
.in-back{animation:inB .38s cubic-bezier(.2,.8,.2,1)}
.in-fade{animation:inFade .35s ease}
@keyframes inF{from{transform:translateX(28px);opacity:0}to{transform:none;opacity:1}}
@keyframes inB{from{transform:translateX(-28px);opacity:0}to{transform:none;opacity:1}}
@keyframes inFade{from{opacity:0}to{opacity:1}}
.has-map.in-fwd,.has-map.in-back{animation:inFade .3s ease}
.has-map .bottom{animation:sheetUp .5s cubic-bezier(.2,.8,.2,1)}
@keyframes sheetUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}

/* ---------- primitives ---------- */
h1.h{font-size:30px;line-height:1.1;letter-spacing:-.03em;font-weight:800}
.muted{color:var(--muted)}
.btn{height:56px;border-radius:18px;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;transition:transform .12s,opacity .2s,background .2s;text-align:center;flex:none}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.35;pointer-events:none}
.btn-primary{background:var(--accent);color:var(--ink)}
.btn-dark{background:var(--ink);color:#fff}
html[data-theme=dark] .btn-dark{background:#F2F3F5;color:var(--ink)}
.btn-ghost{background:var(--surface-2);color:var(--text)}
.btn-danger{background:var(--danger);color:#fff}
.btn.sm{height:42px;border-radius:13px;font-size:14px}
.txt-danger{color:var(--danger)}
.btn-link{font-weight:700;color:var(--muted);font-size:14px;padding:12px;width:100%;text-align:center}
.icon-btn{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;background:var(--surface);color:var(--text);box-shadow:var(--shadow);position:relative;flex:none}
.icon-btn.flat{box-shadow:none;background:var(--surface-2);width:42px;height:42px;border-radius:14px}
.icon-btn.sm{width:36px;height:36px;border-radius:12px}
.icon-btn .nb{position:absolute;top:10px;right:11px;width:9px;height:9px;border-radius:50%;background:var(--danger);border:2px solid var(--surface)}
.avatar{border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-weight:800;flex:none;letter-spacing:.02em;text-shadow:0 1px 2px rgba(0,0,0,.15)}
.chip{height:36px;padding:0 13px;border-radius:12px;background:var(--surface-2);font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;flex:none;transition:background .2s,color .2s}
.chip.on{background:var(--sel-bg);color:var(--sel-fg)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar,.scroll::-webkit-scrollbar,.rides::-webkit-scrollbar,.saved-row::-webkit-scrollbar,.msheet::-webkit-scrollbar{display:none}
.switch{width:50px;height:30px;border-radius:20px;background:var(--surface-3);position:relative;transition:background .25s;flex:none}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:left .25s cubic-bezier(.3,.7,.2,1),background .25s}
.switch.on{background:var(--accent)}
.switch.on::after{left:23px;background:var(--ink)}
.scroll{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;padding:0 20px 24px}
.topbar{display:flex;align-items:center;gap:12px;padding:calc(var(--sat) + 8px) 16px 12px;flex:none}
.topbar h2{flex:1;font-size:18px;font-weight:800;letter-spacing:-.01em}
.tb-big{display:flex;align-items:center;justify-content:space-between;padding:calc(var(--sat) + 14px) 20px 14px;flex:none}
.tb-big h1{font-size:30px;font-weight:800;letter-spacing:-.03em}
.sec{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:22px 2px 10px}
.card{background:var(--surface);border-radius:22px;padding:16px;border:1px solid var(--line)}
.row{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--line);cursor:pointer;width:100%}
.row:last-child{border-bottom:0}
.row .ic{width:42px;height:42px;border-radius:14px;background:var(--surface-2);display:grid;place-items:center;flex:none;color:var(--text)}
.row .tx{flex:1;min-width:0}
.row .t{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.row .r{font-size:13px;color:var(--muted);font-weight:600;flex:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:block;margin-bottom:14px}
.field span{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:6px}
.field input{width:100%;height:52px;border-radius:15px;border:1.5px solid var(--line);background:var(--surface);padding:0 16px;font-size:15px;font-weight:600;outline:none;transition:border-color .2s}
.field input:focus{border-color:var(--text)}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty .ei{width:72px;height:72px;border-radius:24px;background:var(--surface-2);display:grid;place-items:center;margin:0 auto 14px;color:var(--text)}
.empty b{display:block;color:var(--text);font-size:17px;margin-bottom:6px}
.pill-ok{font-size:11px;font-weight:800;padding:3px 8px;border-radius:7px;background:rgba(24,169,87,.12);color:var(--ok)}
.pill-bad{font-size:11px;font-weight:800;padding:3px 8px;border-radius:7px;background:rgba(239,65,53,.12);color:var(--danger)}

/* ---------- bottom sheet (in-screen) ---------- */
.bottom{margin-top:auto;position:relative;flex:none}
.bsheet{background:var(--surface);border-radius:30px 30px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.08);padding:10px 20px calc(var(--sab) + 14px);position:relative}
.bsheet.with-tabs{padding-bottom:14px}
.grab{width:42px;height:5px;border-radius:3px;background:var(--surface-3);margin:0 auto 14px;display:block}
button.grab{height:5px;padding:0;position:relative}
button.grab::before{content:'';position:absolute;inset:-12px -30px}
.float-top{position:absolute;top:calc(var(--sat) + 8px);left:16px;right:16px;display:flex;align-items:center;gap:10px;z-index:5}
.fab{position:absolute;right:16px;top:-62px}

/* ---------- tabbar ---------- */
.tabbar{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding:8px 6px calc(var(--sab) + 2px);flex:none}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--muted);padding:2px 0;text-align:center}
.tabbar .ti{width:54px;height:30px;border-radius:15px;display:grid;place-items:center;transition:background .25s,color .25s}
.tabbar .on{color:var(--text)}
.tabbar .on .ti{background:var(--accent);color:var(--ink)}

/* ---------- splash / onboarding / auth ---------- */
.splash{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0B0C0E;color:#fff;gap:16px;position:relative;overflow:hidden}
.splash .lg{animation:pop .7s cubic-bezier(.2,1.4,.4,1)}
.splash .wm{font-size:36px;font-weight:800;letter-spacing:-.04em;animation:inFade .8s .2s both}
.splash .tg{color:#9AA1AB;font-weight:600;animation:inFade .8s .4s both}
.splash .glow{position:absolute;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(198,241,53,.25),transparent 65%);top:50%;left:50%;transform:translate(-50%,-60%)}
.splash .ld{position:absolute;bottom:calc(var(--sab) + 50px);width:120px;height:4px;border-radius:2px;background:#24272C;overflow:hidden}
.splash .ld i{display:block;height:100%;width:40%;background:var(--accent);border-radius:2px;animation:ld 1.2s ease-in-out infinite}
@keyframes ld{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.ob{flex:1;display:flex;flex-direction:column;padding:calc(var(--sat) + 6px) 0 calc(var(--sab) + 18px);min-height:0}
.ob-top{display:flex;justify-content:space-between;align-items:center;padding:0 20px;height:44px}
.ob-top .brand{margin:0;font-size:17px}
.ob-vp{flex:1;overflow:hidden;min-height:0;touch-action:pan-y}
.ob-track{display:flex;height:100%;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.ob-slide{min-width:100%;padding:0 28px;display:flex;flex-direction:column;justify-content:center}
.ob-art{display:flex;justify-content:center;margin-bottom:18px}
.ob-art svg{width:100%;max-width:300px;height:auto}
.ob-slide h1{font-size:30px;line-height:1.08;letter-spacing:-.03em;font-weight:800;margin-bottom:10px}
.ob-slide p{color:var(--muted);font-size:16px;line-height:1.5}
.ob-foot{padding:0 24px;display:flex;align-items:center;gap:16px}
.dots{display:flex;gap:6px;flex:1}
.dots i{width:8px;height:8px;border-radius:4px;background:var(--surface-3);transition:width .3s,background .3s}
.dots i.on{width:26px;background:var(--text)}
.ob-foot .btn{width:auto;padding:0 26px}
.auth{flex:1;display:flex;flex-direction:column;padding:12px 24px calc(var(--sab) + 16px);min-height:0;overflow-y:auto}
.auth h1{margin:18px 0 8px}
.auth .lead{color:var(--muted);font-size:15.5px;line-height:1.5;margin-bottom:26px}
.ph-in{display:flex;gap:10px;margin-bottom:16px}
.cc{height:58px;padding:0 14px;border-radius:17px;background:var(--surface);border:1.5px solid var(--line);font-weight:800;display:flex;align-items:center;gap:6px;flex:none}
.ph-in input{flex:1;min-width:0;height:58px;border-radius:17px;border:1.5px solid var(--line);background:var(--surface);padding:0 18px;font-size:18px;font-weight:700;outline:none;letter-spacing:.02em}
.ph-in input:focus{border-color:var(--text)}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px;font-weight:600;margin:18px 0}
.or::before,.or::after{content:'';flex:1;height:1px;background:var(--line)}
.legal{margin-top:auto;padding-top:20px;font-size:12.5px;color:var(--muted);line-height:1.5;text-align:center}
.legal b{color:var(--text)}
.otp{display:flex;gap:12px;margin-bottom:22px}
.otp input{width:66px;height:70px;border-radius:19px;border:2px solid var(--line);background:var(--surface);text-align:center;font-size:28px;font-weight:800;outline:none;transition:border-color .2s,transform .2s}
.otp input:focus{border-color:var(--text)}
.otp input.ok{border-color:var(--ok)}
.demo-tip{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--surface-2);font-size:13.5px;font-weight:600;color:var(--muted)}
.spinner{width:22px;height:22px;border-radius:50%;border:3px solid rgba(14,16,19,.2);border-top-color:var(--ink);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- home ---------- */
.av-btn{border-radius:50%;box-shadow:var(--shadow);border:3px solid var(--surface);flex:none;display:block;line-height:0}
.loc-pill{flex:1;min-width:0;height:50px;border-radius:17px;background:var(--surface);box-shadow:var(--shadow);display:flex;align-items:center;gap:10px;padding:0 14px}
.loc-pill .pdot{width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px rgba(24,169,87,.18);flex:none}
.lp-txt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}
.lp-txt small{font-size:11px;color:var(--muted);font-weight:700}
.lp-txt b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.greet{font-size:13.5px;font-weight:700;color:var(--muted);margin-bottom:10px}
.where{display:flex;align-items:center;gap:12px;height:58px;border-radius:19px;background:var(--surface-2);padding:0 8px 0 18px;cursor:pointer;margin-bottom:14px}
.where>span{flex:1;font-size:18px;font-weight:800;letter-spacing:-.01em}
.when-chip{display:flex;align-items:center;gap:5px;height:42px;padding:0 12px;border-radius:14px;background:var(--surface);font-weight:700;font-size:13px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.saved-row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -20px 14px;padding:0 20px}
.sv{display:flex;align-items:center;gap:10px;height:52px;padding:0 14px 0 12px;border-radius:16px;border:1.5px solid var(--line);flex:none;max-width:200px}
.sv .svi{width:30px;height:30px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;flex:none}
.sv span{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.sv b{font-size:13.5px}
.sv small{font-size:11.5px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sv.add{width:52px;padding:0;justify-content:center}
.services{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.svc{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0 9px;border-radius:18px;background:var(--surface-2);font-weight:700;font-size:12.5px;position:relative;text-align:center}
.svc .art{height:34px;display:grid;place-items:center}
.svc .off{position:absolute;top:-6px;right:-2px;font-size:10px;font-weight:800;background:var(--ink);color:var(--accent);padding:2px 6px;border-radius:7px}
.promo{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:20px;background:var(--ink);color:#fff;cursor:pointer;position:relative;overflow:hidden}
html[data-theme=dark] .promo{background:#1E2414}
.promo b{display:block;font-size:15px}
.promo small{color:#B6BCC5;font-size:12.5px;font-weight:600}
.promo .pi{width:42px;height:42px;border-radius:14px;background:var(--accent);color:var(--ink);display:grid;place-items:center;flex:none}
.promo::after{content:'';position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;border:16px solid rgba(198,241,53,.12)}

/* ---------- search ---------- */
.opt-row{display:flex;gap:8px;padding:0 20px 12px}
.route-card{margin:0 20px 6px;background:var(--surface);border-radius:22px;padding:6px 6px 6px 16px;position:relative;box-shadow:var(--shadow)}
.rc-row{display:flex;align-items:center;gap:12px;height:50px}
.rc-row input{flex:1;min-width:0;height:44px;border:0;background:transparent;font-size:15.5px;font-weight:700;outline:none}
.rc-row input::placeholder{color:var(--muted)}
.rc-row.drop input{background:var(--surface-2);border-radius:13px;padding:0 12px;margin-right:46px}
.rc-sep{height:1px;background:var(--line);margin-left:22px;margin-right:52px}
.pd{width:11px;height:11px;border-radius:50%;background:var(--ink);box-shadow:inset 0 0 0 3px var(--accent);flex:none}
html[data-theme=dark] .pd{background:#fff;box-shadow:inset 0 0 0 3px #0E1013}
.dd{width:11px;height:11px;border-radius:3px;background:var(--text);flex:none}
.rc-line{position:absolute;left:21px;top:36px;width:2px;height:28px;background:repeating-linear-gradient(var(--muted) 0 3px,transparent 3px 6px);opacity:.6}
.swap{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center}
.res-head{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:18px 0 4px}

/* ---------- choose ride ---------- */
.route-pill{flex:1;min-width:0;height:46px;border-radius:16px;background:var(--surface);box-shadow:var(--shadow);display:flex;align-items:center;gap:8px;padding:0 14px;font-weight:700;font-size:13.5px}
.route-pill .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.route-pill .ar{color:var(--muted);flex:none}
.sheet-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px}
.sheet-head h3{font-size:20px;font-weight:800;letter-spacing:-.02em}
.sheet-head span{font-size:13px;font-weight:700;color:var(--muted)}
.rides{max-height:214px;overflow-y:auto;margin:0 -10px;padding:0 10px;scrollbar-width:none}
.ride{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:18px;border:2px solid transparent;cursor:pointer;margin-bottom:3px;width:100%;transition:background .2s,border-color .2s}
.ride.sel{border-color:var(--text);background:var(--surface-2)}
.ride .art{width:66px;flex:none;display:grid;place-items:center}
.ride .inf{flex:1;min-width:0}
.ride .nm{font-weight:800;font-size:15.5px;display:flex;align-items:center;gap:6px}
.ride .seats{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:2px;font-weight:700}
.ride .sub{font-size:12.5px;color:var(--muted);font-weight:600;margin-top:1px}
.ride .pr{text-align:right;font-weight:800;font-size:16px;flex:none}
.ride .pr s{display:block;font-size:12px;color:var(--muted);font-weight:600}
.badge{font-size:9.5px;font-weight:800;padding:3px 6px;border-radius:6px;background:var(--accent);color:var(--ink);text-transform:uppercase;letter-spacing:.05em}
.pay-row{display:grid;grid-template-columns:1fr auto;gap:8px;margin:10px 0 12px}
.pay-btn{height:46px;border-radius:15px;background:var(--surface-2);display:flex;align-items:center;gap:9px;padding:0 13px;font-weight:700;font-size:14px;min-width:0}
.pay-btn .lb{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pay-btn.applied{background:rgba(198,241,53,.35)}
html[data-theme=dark] .pay-btn.applied{background:rgba(198,241,53,.16);color:var(--accent)}

/* ---------- searching / tracking ---------- */
.status-pill{flex:1;min-width:0;height:46px;border-radius:16px;background:var(--surface);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;gap:9px;font-weight:800;font-size:13.5px;padding:0 12px}
.status-pill span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live{width:9px;height:9px;border-radius:50%;background:var(--ok);flex:none;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}
.searching h3{font-size:21px;font-weight:800;letter-spacing:-.02em;margin-bottom:4px}
.searching .muted{font-size:14px;font-weight:600;min-height:20px;transition:opacity .3s}
.prog{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin:16px 0}
.prog i{display:block;height:100%;width:35%;border-radius:3px;background:var(--accent);animation:ld 1.4s ease-in-out infinite}
.tm{position:relative;padding:4px 0}
.tm-row{display:flex;align-items:center;gap:14px;padding:7px 0}
.tm-row small{display:block;font-size:11.5px;color:var(--muted);font-weight:700}
.tm-row b{font-size:14.5px}
.tm-line{position:absolute;left:5px;top:28px;bottom:28px;width:2px;background:repeating-linear-gradient(var(--muted) 0 3px,transparent 3px 6px);opacity:.5}
.sum-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line);margin:8px 0 12px;font-weight:700;font-size:14px}
.sum-row span{display:flex;align-items:center;gap:8px;color:var(--muted)}
.eta-head{display:flex;align-items:center;gap:12px}
.eh-txt{flex:1;min-width:0}
.eh-title{font-size:20px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.eh-sub{font-size:13.5px;color:var(--muted);font-weight:600;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eta-badge{width:62px;height:62px;border-radius:20px;background:var(--ink);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;line-height:1}
html[data-theme=dark] .eta-badge{background:var(--accent);color:var(--ink)}
.eta-badge b{font-size:24px;font-weight:800;display:block}
.eta-badge small{font-size:11px;font-weight:700;opacity:.75;margin-top:3px}
.bar{height:5px;border-radius:3px;background:var(--surface-2);margin:14px 0 12px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:3px;transition:width .3s linear}
.drv{display:flex;align-items:center;gap:12px;padding:12px;border-radius:20px;background:var(--surface-2)}
.drv-info{flex:1;min-width:0}
.drv-info b{display:block;font-size:15.5px}
.drv-info span{display:flex;align-items:center;gap:4px;font-size:12.5px;color:var(--muted);font-weight:700;margin-top:2px}
.drv-info span svg{color:var(--gold)}
.drv-info em{font-style:normal;display:block;font-size:12.5px;color:var(--muted);font-weight:600;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drv-car{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.plate{font-weight:800;letter-spacing:.07em;background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:3px 8px;font-size:12.5px}
.pin-row{display:flex;align-items:center;gap:8px;margin-top:10px;padding:10px 14px;border-radius:16px;border:1.5px dashed var(--line);font-size:13px;font-weight:700;color:var(--muted)}
.pin-row span{flex:1}
.pin{font-size:16px;font-weight:800;letter-spacing:.18em;color:var(--text)}
.actions4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0}
.act{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:700;text-align:center}
.act .c{width:54px;height:50px;border-radius:17px;background:var(--surface-2);display:grid;place-items:center;position:relative;transition:transform .15s}
.act:active .c{transform:scale(.93)}
.act .c .dot{position:absolute;top:8px;right:10px;width:10px;height:10px;border-radius:50%;background:var(--danger);border:2px solid var(--surface-2)}
.act.sos .c{background:var(--sos-bg);color:var(--danger)}
.bsheet.min .hide-min{display:none}

/* ---------- banner / toast / modal sheet ---------- */
#banner{position:absolute;top:calc(var(--sat) + 6px);left:10px;right:10px;z-index:85;transform:translateY(calc(-100% - var(--sat) - 40px));transition:transform .45s cubic-bezier(.2,.9,.2,1);pointer-events:none}
#banner.show{transform:none;pointer-events:auto}
.bn{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:22px;background:rgba(255,255,255,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 12px 30px rgba(0,0,0,.18);cursor:pointer;color:var(--ink)}
html[data-theme=dark] .bn{background:rgba(38,42,48,.94);color:#fff}
.bn b{display:block;font-size:14px}
.bn small{display:block;font-size:13px;opacity:.75;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bn .bt{flex:1;min-width:0}
#toast{position:absolute;left:50%;bottom:calc(var(--sab) + 96px);transform:translate(-50%,16px);background:var(--ink);color:#fff;padding:12px 16px;border-radius:15px;opacity:0;transition:opacity .25s,transform .3s;z-index:95;font-weight:700;font-size:14px;max-width:86%;width:max-content;display:flex;gap:9px;align-items:center;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.25)}
html[data-theme=dark] #toast{background:#F2F3F5;color:var(--ink)}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast svg{color:var(--accent);flex:none}
html[data-theme=dark] #toast svg{color:var(--ok)}
#sheetLayer{position:absolute;inset:0;z-index:80;pointer-events:none}
#sheetLayer.open{pointer-events:auto}
.backdrop{position:absolute;inset:0;background:rgba(5,6,8,.45);opacity:0;transition:opacity .3s}
#sheetLayer.open .backdrop{opacity:1}
.msheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:30px 30px 0 0;padding:10px 20px calc(var(--sab) + 16px);transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.8,.2,1);max-height:90%;overflow-y:auto;scrollbar-width:none}
#sheetLayer.open .msheet{transform:none}
.sh-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px}
.sh-head>div{flex:1}
.sh-head h3{font-size:21px;font-weight:800;letter-spacing:-.02em}
.sh-head p{font-size:14px;color:var(--muted);font-weight:600;margin-top:4px;line-height:1.4}
.opt{display:flex;align-items:center;gap:14px;padding:13px 14px;border-radius:17px;border:2px solid var(--line);margin-bottom:8px;width:100%;font-weight:700;font-size:15px;transition:border-color .2s}
.opt.on{border-color:var(--text)}
.opt .ic{width:40px;height:40px;border-radius:13px;background:var(--surface-2);display:grid;place-items:center;flex:none}
.opt .tx{flex:1;min-width:0}
.opt small{display:block;font-size:12.5px;color:var(--muted);font-weight:600}
.radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--surface-3);flex:none;display:grid;place-items:center}
.opt.on .radio{border-color:var(--text);background:var(--text);color:var(--bg)}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0;max-height:190px;overflow-y:auto;scrollbar-width:none}
.slot{height:42px;border-radius:13px;background:var(--surface-2);font-weight:700;font-size:13px;text-align:center}
.slot.on{background:var(--sel-bg);color:var(--sel-fg)}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:15px;background:var(--surface-2);font-size:13px;font-weight:600;color:var(--muted);line-height:1.45;margin-bottom:14px}
.note svg{margin-top:1px}
.amounts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.amounts button{height:50px;border-radius:15px;background:var(--surface-2);font-weight:800;font-size:15px;text-align:center}
.amounts button.on{background:var(--sel-bg);color:var(--sel-fg)}
.link-box{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 16px;border-radius:16px;background:var(--surface-2);font-weight:700;font-size:14px;margin-bottom:16px}
.link-box span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reason{margin-bottom:16px}
.reason .chip{margin:0 6px 8px 0}

/* ---------- chat / call ---------- */
.chat-top{border-bottom:1px solid var(--line);background:var(--surface)}
.chat-top .who{flex:1;display:flex;align-items:center;gap:10px;min-width:0}
.chat-top .who b{display:block;font-size:15.5px}
.chat-top .who small{display:block;font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-body{flex:1;min-height:0;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:6px;scrollbar-width:none}
.chat-body::-webkit-scrollbar{display:none}
.day-sep{align-self:center;font-size:11.5px;font-weight:700;color:var(--muted);background:var(--surface-2);padding:4px 10px;border-radius:9px;margin:4px 0 8px}
.msg{max-width:78%;padding:10px 14px;border-radius:19px;font-size:14.5px;line-height:1.42;font-weight:500;animation:pop .3s cubic-bezier(.2,1.2,.4,1)}
.msg.me{align-self:flex-end;background:var(--ink);color:#fff;border-bottom-right-radius:6px}
html[data-theme=dark] .msg.me{background:var(--accent);color:var(--ink)}
.msg.them{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px}
.msg time{display:block;font-size:10.5px;opacity:.55;margin-top:3px;font-weight:600}
.typing{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:19px;padding:13px 16px;display:flex;gap:4px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:tdot 1.2s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes tdot{0%,60%,100%{transform:none;opacity:.5}30%{transform:translateY(-4px);opacity:1}}
.quick{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:8px 16px;flex:none}
.quick::-webkit-scrollbar{display:none}
.quick button{height:36px;padding:0 14px;border-radius:18px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:13px;white-space:nowrap;flex:none}
.composer{display:flex;gap:8px;padding:8px 14px calc(var(--sab) + 8px);background:var(--surface);border-top:1px solid var(--line);flex:none}
.composer input{flex:1;min-width:0;height:48px;border-radius:24px;border:0;background:var(--surface-2);padding:0 18px;font-size:15px;outline:none}
.composer button{width:48px;height:48px;border-radius:50%;background:var(--accent);color:var(--ink);display:grid;place-items:center;flex:none}
.call{flex:1;display:flex;flex-direction:column;align-items:center;background:radial-gradient(500px 420px at 50% 30%,#2A3417,#0B0C0E 70%);color:#fff;padding:calc(var(--sat) + 70px) 24px calc(var(--sab) + 40px)}
.call .ring{position:relative;margin-bottom:22px}
.call .ring::before,.call .ring::after{content:'';position:absolute;inset:-14px;border-radius:50%;border:2px solid rgba(198,241,53,.35);animation:ringp 2s infinite}
.call .ring::after{animation-delay:1s}
@keyframes ringp{from{transform:scale(.9);opacity:1}to{transform:scale(1.35);opacity:0}}
.call h2{font-size:28px;font-weight:800;letter-spacing:-.02em}
.call .cs{color:#A9B0BA;font-weight:600;margin-top:6px;font-variant-numeric:tabular-nums}
.call-ctl{margin-top:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:22px;width:100%;max-width:300px}
.call-ctl button{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:#C9CED6;text-align:center}
.call-ctl .cb{width:66px;height:66px;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center;color:#fff;transition:background .2s}
.call-ctl .on .cb{background:#fff;color:var(--ink)}
.call-ctl .end .cb{background:var(--danger)}

/* ---------- complete ---------- */
.done-hero{text-align:center;padding:calc(var(--sat) + 26px) 0 20px}
.check-badge{width:78px;height:78px;border-radius:50%;background:var(--accent);color:var(--ink);display:grid;place-items:center;margin:0 auto 16px;animation:pop .6s cubic-bezier(.2,1.4,.4,1);box-shadow:0 0 0 10px rgba(198,241,53,.22)}
.done-hero h1{font-size:28px;font-weight:800;letter-spacing:-.03em}
.done-hero p{color:var(--muted);font-weight:600;margin-top:4px}
.fare-total{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.fare-total b{font-size:30px;font-weight:800;letter-spacing:-.03em}
.fare-total span{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13.5px;color:var(--muted)}
.fl{display:flex;justify-content:space-between;font-size:14px;font-weight:600;color:var(--muted);padding:5px 0}
.fl b{color:var(--text);font-weight:700}
.fl.disc b{color:var(--ok)}
.rate-card{margin-top:12px;text-align:center}
.rate-card .q{font-weight:800;font-size:16px;margin:10px 0 12px}
.stars{display:flex;justify-content:center;gap:6px;margin-bottom:12px}
.stars button{color:var(--surface-3);transition:transform .15s,color .15s}
.stars button.on{color:var(--gold)}
.stars button:active{transform:scale(.85)}
.tags{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;margin-bottom:14px;min-height:0}
.tip-lbl{font-size:13px;font-weight:700;color:var(--muted);margin:4px 0 8px}
.tips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tips button{height:44px;border-radius:14px;background:var(--surface-2);font-weight:800;font-size:14px;text-align:center}
.tips button.on{background:var(--sel-bg);color:var(--sel-fg)}

/* ---------- activity / wallet / account ---------- */
.seg{display:flex;background:var(--surface-2);border-radius:15px;padding:4px;margin:0 20px 14px;flex:none}
.seg button{flex:1;height:38px;border-radius:11px;font-weight:700;color:var(--muted);font-size:14px;text-align:center;display:flex;align-items:center;justify-content:center;gap:6px}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.cnt{font-style:normal;font-size:11px;background:var(--accent);color:var(--ink);border-radius:8px;padding:1px 6px}
.month{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.month div{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px}
.month b{display:block;font-size:18px;font-weight:800;letter-spacing:-.02em}
.month small{font-size:11.5px;color:var(--muted);font-weight:700}
.tcard{display:flex;gap:12px;align-items:center;padding:10px;border-radius:20px;background:var(--surface);border:1px solid var(--line);margin-bottom:10px;cursor:pointer;width:100%;transition:transform .15s}
.tcard:active{transform:scale(.99)}
.thumb{width:62px;height:62px;border-radius:15px;overflow:hidden;flex:none;background:var(--map-land)}
.tcard .tx{flex:1;min-width:0}
.tcard .t{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tcard .s{font-size:12.5px;color:var(--muted);font-weight:600;margin-top:2px}
.tcard .p{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:5px;font-weight:800}
.ucard{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:12px}
.ucard .uw{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px;background:rgba(198,241,53,.35);padding:6px 10px;border-radius:10px;width:max-content;margin-bottom:10px}
html[data-theme=dark] .ucard .uw{background:rgba(198,241,53,.15);color:var(--accent)}
.ucard b{display:block;font-size:17px}
.ucard small{display:block;color:var(--muted);font-weight:600;font-size:13px;margin:3px 0 12px}
.bal{background:var(--ink);color:#fff;border-radius:26px;padding:20px;position:relative;overflow:hidden}

/* ---------- chat ---------- */
function openChat(who) {
  S.chatWho = who;
  if (who === 'support' && !S.chats.support.length) S.chats.support.push({ from: 'them', text: `Hi ${S.user.first}! This is ${APP} Support. How can we help today?`, t: fmtTime(new Date()) });
  if (current === 'chat') { render('chat', 'none'); return; }
  go('chat');
}
function renderChat(typing) {
  const b = $('#chatBody'); if (!b) return;
  const list = S.chats[S.chatWho];
  b.innerHTML = `<div class="day-sep">Today</div>` + (list.length ? '' : `<div class="day-sep" style="background:none">Messages are end-to-end private to this trip</div>`) + list.map(m => `<div class="msg ${m.from === 'me' ? 'me' : 'them'}">${esc(m.text)}<time>${m.t}</time></div>`).join('') + (typing ? '<div class="typing"><i></i><i></i><i></i></div>' : '');
  b.scrollTop = b.scrollHeight;
}
function sendChat(text) {
  text = (text || '').trim(); if (!text) return;
  const who = S.chatWho;
  S.chats[who].push({ from: 'me', text, t: fmtTime(new Date()) });
  renderChat(true);
  const l = text.toLowerCase();
  let reply;
  if (who === 'driver') {
    reply = /late|min/.test(l) ? 'No problem, I\'ll wait for you 👍' : /call/.test(l) ? 'Sure — calling you in a sec.' : /thank/.test(l) ? 'You\'re welcome! Have a great day.' : /where|pickup|here/.test(l) ? `I'm by the corner of Market St — ${RIDE(S.ride).car.split(' · ').reverse().join(' ').toLowerCase()} with hazards on.` : 'Got it, thanks!';
  } else {
    reply = S.chats.support.filter(m => m.from === 'me').length === 1 ? `Thanks for reaching out, ${S.user.first}. I'm Priya from the support team — I've pulled up your recent trips. Could you tell me a bit more?` : 'Understood. I\'ve logged this for you and you\'ll get an update by email within 24 hours. Anything else?';
  }
  setTimeout(() => {
    S.chats[who].push({ from: 'them', text: reply, t: fmtTime(new Date()) });
    if (current === 'chat' && S.chatWho === who) renderChat(); else if (who === 'driver') { S.unread.driver++; banner(DRIVER.first, reply, avatar(DRIVER.name, 40), () => openChat('driver')); }
  }, 1500 + Math.random() * 800);
}

/* ---------- tracking UI updates ---------- */
let tCache = {};
function updTracking(full) {
  if (current !== 'tracking') return;
  const el = curEl(); if (!el) return;
  const d = S.drop || PLACES[0], r = RIDE(S.ride), ph = TRIP.phase;
  let title = '', sub = '', badge = '', pill = '', pct = 0;
  if (ph === 'arrive') {
    const m = Math.max(1, Math.ceil((1 - TRIP.prog) * r.eta));
    title = `${DRIVER.first} is on the way`; sub = `${r.car} · ${PLATE}`; badge = `<b>${m}</b><small>min</small>`; pill = `Arriving in ${m} min`; pct = TRIP.prog * 100;
  } else if (ph === 'arrived') {
    title = 'Your driver has arrived'; sub = `Meet at ${S.pickup.addr} · PIN ${PIN}`; badge = `<b>${ic('check', 24, 3)}</b><small>here</small>`; pill = `${DRIVER.first} is waiting`; pct = 100;
  } else if (ph === 'ontrip') {
    const tm = tripMin(d.km), m = Math.max(1, Math.ceil((1 - TRIP.prog) * tm)), left = Math.max(.1, d.km * (1 - TRIP.eased)).toFixed(1);
    title = `Heading to ${d.name}`; sub = `Arrive ${fmtTime(new Date(Date.now() + m * 60000))} · ${left} km left`; badge = `<b>${m}</b><small>min</small>`; pill = 'On trip · sharing live'; pct = TRIP.prog * 100;
  } else return;
  const set = (id, v, prop = 'innerHTML') => { if (tCache[id] !== v) { const e = el.querySelector('#' + id); if (e) e[prop] = v; tCache[id] = v; } };
  set('tTitle', title); set('tSub', sub); set('tBadge', badge); set('tPill', pill);
  const bar = el.querySelector('#tBar'); if (bar) bar.style.width = pct.toFixed(1) + '%';
  if (full) {
    tCache = {}; set('tTitle', title); set('tSub', sub); set('tBadge', badge); set('tPill', pill);
    const pin = el.querySelector('#tPin'); if (pin) pin.style.display = ph === 'ontrip' ? 'none' : '';
    const mb = el.querySelector('#tMain');
    if (ph === 'arrive') { mb.className = 'btn btn-ghost txt-danger'; mb.textContent = 'Cancel ride'; mb.onclick = openCancel; }
    else if (ph === 'arrived') { mb.className = 'btn btn-primary'; mb.innerHTML = `${ic('play', 18)} I'm in the car — start trip`; mb.onclick = beginRide; }
    else { mb.className = 'btn btn-ghost'; mb.innerHTML = `${ic('zap', 18)} Fast-forward to drop-off (demo)`; mb.onclick = fastForward; }
  }
}

    html: () => `<div class="tb-big"><h1>Wallet</h1><button class="icon-btn flat" onclick="openPromo()" aria-label="Promotions">${ic('gift', 20)}</button></div>
      <div class="scroll">
        <div class="bal"><div class="bl">${logo(22)} ${APP} Cash</div><div class="amt">${money(S.wallet)}</div><div class="grid2"><button class="btn btn-primary" onclick="openAddMoney()">${ic('plus', 18)} Add money</button><button class="btn btn-glass" onclick="S.pay='wallet';refresh();toast('${APP} Cash set as default')">${ic('check', 18)} Use for rides</button></div></div>
        <div class="sec">Payment methods</div>
        <div class="card" style="padding:2px 16px" id="pm">${S.cards.map(c => { const p = payInfo(c.id); return `<button class="row" data-id="${c.id}"><span class="ic">${ic(p.icon, 19)}</span><span class="tx"><div class="t">${p.label}</div>${S.pay === c.id ? '<div class="s">Default for rides</div>' : ''}</span>${S.pay === c.id ? `<span class="badge">Default</span>` : ic('chevR', 18)}</button>`; }).join('')}<button class="row" onclick="openAddCard()"><span class="ic">${ic('plus', 19)}</span><span class="tx"><div class="t">Add payment method</div></span></button></div>
        <div class="sec">Promotions</div>
        ${Object.entries(PROMOS).map(([k, v]) => `<div class="promo-c"><span style="width:40px;height:40px;border-radius:13px;background:var(--accent);color:var(--ink);display:grid;place-items:center;flex:none">${ic('tag', 19)}</span><div class="tx"><div class="code">${k}</div><small>${v.desc}</small></div><button class="btn sm ${S.promo === k ? 'btn-ghost' : 'btn-dark'}" style="width:auto;padding:0 14px" onclick="applyPromo('${k}');refresh()">${S.promo === k ? 'Applied' : 'Apply'}</button></div>`).join('')}
        <div class="sec">Recent activity</div>
        <div class="card" style="padding:2px 16px">${S.tx.slice(0, 8).map(x => `<div class="row" style="cursor:default"><span class="ic">${ic(x.a > 0 ? 'plus' : 'receipt', 18)}</span><span class="tx"><div class="t">${esc(x.t)}</div><div class="s">${esc(x.s)}</div></span><span class="${x.a > 0 ? 'amt-pos' : ''}" style="font-weight:800">${x.a > 0 ? '+' : '−'}${money(Math.abs(x.a))}</span></div>`).join('')}</div>
      </div>${tabbar('wallet')}`,
    mount(el) { el.querySelector('#pm').addEventListener('click', e => { const b = e.target.closest('[data-id]'); if (!b) return; S.pay = b.dataset.id; toast(payInfo(S.pay).c.label + ' set as default'); refresh(); }); }
  },

  /* ---- account ---- */
  account: {
    html: () => {
      const done = S.trips.filter(t => t.status === 'Completed');
      const km = Math.round(done.reduce((a, t) => a + t.km, 0) + 284);
      return `<div class="scroll">
        <div class="prof">${avatar(S.user.name, 66)}<div class="tx"><b>${esc(S.user.name)}</b><small>${esc(S.user.phone)}</small><span class="rate-chip">${icf('star', 13)} ${S.user.rating} rider rating</span></div><button class="icon-btn flat" onclick="go('editProfile')" aria-label="Edit profile">${ic('edit', 19)}</button></div>
        <div class="stats3"><div><b>${done.length + 44}</b><small>Trips</small></div><div><b>${km}</b><small>km travelled</small></div><div><b>18 kg</b><small>CO₂ saved</small></div></div>
        <div class="sec">Account</div>
        <div class="mgroup">
          <button class="mrow" onclick="go('saved')"><span class="ic">${ic('pin', 19)}</span><span class="lbl">Saved places</span><span class="val">${S.saved.length}</span>${ic('chevR', 18)}</button>
          <button class="mrow" onclick="tab('wallet')"><span class="ic">${ic('card', 19)}</span><span class="lbl">Payment methods</span><span class="val">${payInfo(S.pay).c.label}</span>${ic('chevR', 18)}</button>
          <button class="mrow" onclick="go('safety')"><span class="ic">${ic('shield', 19)}</span><span class="lbl">Safety toolkit</span><span class="val">${S.contacts.length} contact${S.contacts.length === 1 ? '' : 's'}</span>${ic('chevR', 18)}</button>
          <button class="mrow" onclick="go('notifications')"><span class="ic">${ic('bell', 19)}</span><span class="lbl">Inbox</span>${S.notifs.some(n => n.unread) ? '<span class="badge">New</span>' : ''}${ic('chevR', 18)}</button>
        </div>
        <div class="sec">Preferences</div>
        <div class="mgroup" id="prefs">
          <div class="mrow" style="cursor:default"><span class="ic">${ic(S.theme === 'dark' ? 'moon' : 'sun', 19)}</span><span class="lbl">Dark mode</span>${toggleHTML('theme', S.theme === 'dark')}</div>
          <button class="mrow" onclick="openNotifPrefs()"><span class="ic">${ic('sliders', 19)}</span><span class="lbl">Notifications</span>${ic('chevR', 18)}</button>
          <button class="mrow" onclick="openLang()"><span class="ic">${ic('globe', 19)}</span><span class="lbl">Language</span><span class="val">${S.lang}</span>${ic('chevR', 18)}</button>
        </div>
        <div class="sec">Support</div>
        <div class="mgroup">
          <button class="mrow" onclick="go('help')"><span class="ic">${ic('help', 19)}</span><span class="lbl">Help & support</span>${ic('chevR', 18)}</button>
          <button class="mrow" onclick="openAbout()"><span class="ic">${ic('info', 19)}</span><span class="lbl">About ${APP}</span>${ic('chevR', 18)}</button>
          <button class="mrow danger" onclick="openLogout()"><span class="ic">${ic('logout', 19)}</span><span class="lbl">Log out</span></button>
        </div>
        <div class="ver">${APP} · v1.0 concept prototype</div>
      </div>${tabbar('account')}`;
    },
    mount(el) { bindToggles(el.querySelector('#prefs')); }
  },

  /* ---- edit profile ---- */
  editProfile: {
    html: () => `<div class="topbar"><button class="icon-btn flat" onclick="back()" aria-label="Back">${ic('chevL')}</button><h2>Edit profile</h2></div>
      <div class="scroll">
        <div class="edit-av">${avatar(S.user.name, 96)}<button onclick="toast('Photo upload opens your camera roll')" aria-label="Change photo">${ic('camera', 16)}</button></div>
        <label class="field"><span>Full name</span><input id="epN" value="${esc(S.user.name)}"></label>
        <label class="field"><span>Email</span><input id="epE" type="email" value="${esc(S.user.email)}"></label>
        <label class="field"><span>Phone</span><input id="epP" inputmode="tel" value="${esc(S.user.phone)}"></label>
        <div class="note">${ic('lock', 16)}<span>Your phone number is masked from drivers on every trip.</span></div>
        <button class="btn btn-dark" id="epS">Save changes</button>
      </div>`,
    mount(el) {
      el.querySelector('#epS').onclick = () => {
        const n = el.querySelector('#epN').value.trim(); if (!n) { toast('Name can\'t be empty'); return; }
        S.user.name = n; S.user.first = n.split(' ')[0]; S.user.email = el.querySelector('#epE').value.trim(); S.user.phone = el.querySelector('#epP').value.trim();
        back(); toast('Profile updated');
      };
    }
  },

  /* ---- saved places ---- */
  saved: {
    html: () => `<div class="topbar"><button class="icon-btn flat" onclick="back()" aria-label="Back">${ic('chevL')}</button><h2>Saved places</h2></div>
      <div class="scroll"><div class="card" style="padding:2px 16px" id="spl">${S.saved.map(p => `<div class="row" data-go="${p.id}"><span class="ic">${ic(p.icon, 19)}</span><span class="tx"><div class="t">${esc(p.name)}</div><div class="s">${esc(p.addr)}</div></span><button class="icon-btn flat sm" data-del="${p.id}" aria-label="Remove">${ic('trash', 16)}</button></div>`).join('')}</div>
      <button class="btn btn-ghost" style="margin-top:14px" onclick="openAddPlace()">${ic('plus', 18)} Add a place</button>
      <div class="note" style="margin-top:14px">${ic('info', 16)}<span>Tap a place to book a ride there instantly.</span></div></div>`,
    mount(el) {
      el.querySelector('#spl').onclick = e => {
        const d = e.target.closest('[data-del]'); if (d) { S.saved = S.saved.filter(p => p.id !== d.dataset.del); toast('Place removed'); refresh(); return; }
        const g = e.target.closest('[data-go]'); if (g) quickTo(g.dataset.go);
      };
    }
  },

  /* ---- safety ---- */
  safety: {
    html: () => `<div class="topbar"><button class="icon-btn flat" onclick="back()" aria-label="Back">${ic('chevL')}</button><h2>Safety toolkit</h2></div>
      <div class="scroll">
        <div class="safety-hero"><span class="si">${ic('shield', 26)}</span><div><b>Ride with confidence</b><small>Every trip is GPS-tracked, PIN-verified and backed by a 24/7 safety team.</small></div></div>
        <div class="sec">Trip protection</div>
        <div class="mgroup" id="sfT">
          <div class="mrow" style="cursor:default"><span class="ic">${ic('share', 19)}</span><span class="lbl">Auto-share trips<div class="muted" style="font-size:12.5px;font-weight:600">With your emergency contacts</div></span>${toggleHTML('autoShare', S.settings.autoShare)}</div>
          <div class="mrow" style="cursor:default"><span class="ic">${ic('lock', 19)}</span><span class="lbl">PIN verification<div class="muted" style="font-size:12.5px;font-weight:600">Confirm the right car every time</div></span>${toggleHTML('pinVerify', S.settings.pinVerify)}</div>
          <div class="mrow" style="cursor:default"><span class="ic">${ic('alert', 19)}</span><span class="lbl">RideCheck<div class="muted" style="font-size:12.5px;font-weight:600">Alerts on long stops or route changes</div></span>${toggleHTML('rideCheck', S.settings.rideCheck)}</div>
        </div>
        <div class="sec">Emergency contacts</div>
        <div class="card" style="padding:2px 16px">${S.contacts.map(c => `<div class="row" style="cursor:default">${avatar(c.name, 40)}<span class="tx"><div class="t">${esc(c.name)}</div><div class="s">${esc(c.rel)} · ${esc(c.phone)}</div></span></div>`).join('')}<button class="row" onclick="openAddContact()"><span class="ic">${ic('plus', 19)}</span><span class="tx"><div class="t">Add contact</div></span></button></div>
        <button class="btn btn-danger" style="margin-top:18px" onclick="openSOS()">${ic('phone', 20)} Emergency assistance</button>
      </div>`,
    mount(el) { bindToggles(el.querySelector('#sfT'), (k, v) => toast(v ? 'Turned on' : 'Turned off')); }
  },

  /* ---- notifications ---- */
  notifications: {
    html: () => `<div class="topbar"><button class="icon-btn flat" onclick="back()" aria-label="Back">${ic('chevL')}</button><h2>Inbox</h2><button class="chip" id="markAll">Mark all read</button></div>
      <div class="scroll" id="nl">${S.notifs.map((n, i) => `<button class="notif ${n.unread ? 'unread' : ''}" data-i="${i}"><span class="ic">${ic(n.ic, 19)}</span><span class="tx"><b>${n.t}</b><small>${n.s}</small></span><time>${n.time}</time></button>`).join('')}</div>`,
    mount(el) {
      el.querySelector('#markAll').onclick = () => { S.notifs.forEach(n => n.unread = false); refresh(); toast('All caught up'); };
      el.querySelector('#nl').onclick = e => {
        const b = e.target.closest('[data-i]'); if (!b) return; const n = S.notifs[+b.dataset.i]; n.unread = false;
        if (n.ic === 'gift') { applyPromo('GREEN20', true); refresh(); }
        else if (n.ic === 'shield') go('safety');
        else if (n.ic === 'receipt') { S.viewTrip = 't1'; go('trip'); }
        else refresh();
      };
    }
  },

  /* ---- help ---- */
  help: {
    html: () => {
      const faqs = [
        ['How is my fare calculated?', 'You see an upfront price before booking, based on distance, estimated time and demand. Promotions are applied automatically at checkout.'],
        ['I left something in the car', 'Open the trip in Activity and tap "Report an issue". We\'ll connect you with your driver to arrange a return.'],
        ['How do I cancel a ride?', 'Tap "Cancel ride" on the trip screen. Cancelling within 2 minutes of booking is always free.'],
        ['Is my phone number shared?', 'No. Calls and messages go through a masked number so drivers never see your real contact details.'],
        ['How does trip sharing work?', 'Share a live link with anyone. They can follow your route and ETA in a browser — no app needed.']
      ];
      return `<div class="topbar"><button class="icon-btn flat" onclick="back()" aria-label="Back">${ic('chevL')}</button><h2>Help & support</h2></div>
      <div class="scroll"><div class="search-in">${ic('search', 19)}<input id="hq" placeholder="Search help articles"></div>
        <div id="faqs">${faqs.map(([q, a]) => `<div class="faq"><button>${'<span>' + q + '</span>'}${ic('chevD', 18)}</button><p>${a}</p></div>`).join('')}</div>
        <div class="card" style="margin-top:20px;display:flex;gap:12px;align-items:center">${logo(44)}<div style="flex:1"><b>Still need help?</b><div class="muted" style="font-size:13px;font-weight:600">Chat with us 24/7</div></div><button class="btn sm btn-dark" style="width:auto;padding:0 16px" onclick="openChat('support')">Chat</button></div>
      </div>`;
    },
    mount(el) {
      el.querySelector('#faqs').onclick = e => { const b = e.target.closest('.faq button'); if (b) b.parentElement.classList.toggle('open'); };
      el.querySelector('#hq').oninput = e => { const q = e.target.value.toLowerCase(); $$('.faq', el).forEach(f => f.style.display = f.textContent.toLowerCase().includes(q) ? '' : 'none'); };
    }
  }
};

function actList() {
  if (S.actTab === 'upcoming') {
    if (!S.upcoming.length) return `<div class="empty"><div class="ei">${ic('calendar', 30)}</div><b>No upcoming rides</b>Plan ahead for airport runs and early meetings.<br><br><button class="btn btn-dark" style="max-width:220px;margin:0 auto" onclick="openSchedule(()=>{ if(S.when!=='Now') go('search') })">Schedule a ride</button></div>`;
    return S.upcoming.map(u => `<div class="ucard"><div class="uw">${ic('calendar', 15)} ${esc(u.when)}</div><b>${esc(u.name)}</b><small>${RIDE(u.ride).name} · est. ${money(u.price)} · driver assigned 10 min before</small><div class="grid2"><button class="btn sm btn-ghost txt-danger" data-cancel="${u.id}">Cancel</button><button class="btn sm btn-ghost" onclick="toast('Reminder set for 15 min before pickup')">${ic('bell', 16)} Remind me</button></div></div>`).join('');
  }
  const done = S.trips.filter(t => t.status === 'Completed');
  const spent = done.reduce((a, t) => a + t.price, 0);
  return `<div class="month"><div><b>${done.length}</b><small>Rides</small></div><div><b>${money(spent)}</b><small>Spent</small></div><div><b>${done.reduce((a, t) => a + t.km, 0).toFixed(0)} km</b><small>Distance</small></div></div>` +
    S.trips.map(t => `<button class="tcard" data-trip="${t.id}"><span class="thumb">${routeThumb(ROUTES[t.route || 0])}</span><span class="tx"><div class="t">${esc(t.name)}</div><div class="s">${t.date}</div><div class="s">${RIDE(t.ride).name}</div></span><span class="p">${t.status === 'Completed' ? money(t.price) : money(0)}<span class="${t.status === 'Completed' ? 'pill-ok' : 'pill-bad'}">${t.status}</span></span></button>`).join('');
}

/* ---------- theme, pitch, frame ---------- */
S.theme = 'light';
function setTheme(t) {
  S.theme = t; document.documentElement.dataset.theme = t;
  const b = $('#themeBtn'); if (b) b.innerHTML = `${ic(t === 'dark' ? 'sun' : 'moon', 17)} ${t === 'dark' ? 'Light' : 'Dark'} mode`;
  if (current === 'account') { const i = curEl().querySelector('#prefs .ic'); if (i) i.innerHTML = ic(t === 'dark' ? 'moon' : 'sun', 19); }
}
const JUMPS = [['onboarding', 'Onboarding'], ['login', 'Sign in'], ['home', 'Home'], ['search', 'Search'], ['choose', 'Choose ride'], ['tracking', 'Live tracking'], ['chat', 'Driver chat'], ['complete', 'Trip complete'], ['activity', 'Activity'], ['wallet', 'Wallet'], ['account', 'Account'], ['safety', 'Safety']];
function jump(n) {
  closeSheet(true);
  if (!S.drop) setDrop(PLACES[0]);
  if (!['tracking', 'chat'].includes(n)) stopTrip();
  switch (n) {
    case 'search': go('search', { reset: true, stack: ['home'] }); break;
    case 'choose': go('choose', { reset: true, stack: ['home'] }); break;
    case 'tracking': startTrip(); go('tracking', { reset: true }); break;
    case 'chat': if (!TRIP.phase) startTrip(); S.chatWho = 'driver'; go('chat', { reset: true, stack: ['tracking'] }); break;
    case 'complete': makeLast(); go('complete', { reset: true }); break;
    case 'safety': go('safety', { reset: true, stack: ['account'] }); break;
    default: go(n, { reset: true });
  }
}
function markJump(name) {
  const map = { otp: 'login', searching: 'choose', call: 'chat', trip: 'activity', editProfile: 'account', saved: 'account', notifications: 'home', help: 'account' };
  const k = map[name] || name;
  $$('#jump button').forEach(b => b.classList.toggle('on', b.dataset.j === k));
}
function buildPitch() {
  $('#pitch').innerHTML = `<div class="brand">${logo(36)}${APP}<em>Concept</em></div>
    <h1>Mobility app — interactive prototype</h1>
    <p>A clickable concept of the rider app: book a ride, watch your driver arrive in real time, and manage your account. Use it just like a real phone.</p>
    <ul class="feats">
      <li><span>${ic('car', 16, 2.4)}</span>Ride booking with upfront pricing</li>
      <li><span>${ic('nav', 16, 2.4)}</span>Real-time driver & trip tracking</li>
      <li><span>${ic('msg', 16, 2.4)}</span>In-app chat, calling & safety tools</li>
      <li><span>${ic('user', 16, 2.4)}</span>Account, wallet & trip history</li>
    </ul>
    <div class="jump-title">Jump to a screen</div>
    <div class="jump" id="jump">${JUMPS.map(([k, l]) => `<button data-j="${k}">${l}</button>`).join('')}</div>
    <div class="pitch-foot"><button id="themeBtn">${ic('moon', 17)} Dark mode</button><button id="restartBtn">${ic('repeat', 17)} Restart demo</button></div>
    <div class="hint-small">Tip: open this page on a phone for the full-screen app experience.</div>`;
  $('#jump').onclick = e => { const b = e.target.closest('[data-j]'); if (b) jump(b.dataset.j); };
  $('#themeBtn').onclick = () => { setTheme(S.theme === 'dark' ? 'light' : 'dark'); if (current === 'account') refresh(); };
  $('#restartBtn').onclick = () => { stopTrip(); S.onboarded = false; S.drop = null; S.promo = null; S.when = 'Now'; S.whenLabel = 'Now'; go('splash', { reset: true }); };
}
function fitPhone() {
  const mobile = window.innerWidth <= 520;
  const s = mobile ? 1 : Math.min(1, (window.innerHeight - 40) / 844);
  document.documentElement.style.setProperty('--s', s.toFixed(4));
  if (MAP.svg) { const el = curEl(); if (MAP.mode && el) MAP.view(MAP.mode === 'trip' || MAP.mode === 'arrive' ? (TRIP.phase === 'ontrip' ? 'trip' : 'arrive') : MAP.mode, bottomH(el), topH(el)); }
}
function tick() { const t = fmtTime(new Date()).replace(/\s?[AP]M/, ''); $('#sbTime').textContent = t; }

/* ---------- boot ---------- */
buildPitch(); fitPhone(); tick(); setInterval(tick, 15000);
MAP.init();
window.addEventListener('resize', () => { clearTimeout(window.__rz); window.__rz = setTimeout(fitPhone, 120); });
go('splash');
</script>
</body>
</html>
